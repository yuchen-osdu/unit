LOG_PREFIX=unit
server.servlet.contextPath=/api/unit/
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
server.port=8080

# OpenAPI contract enforcement (os-core-common): require Authorization, reject
# blocked verbs (TRACE/QUERY) with 405, and return JSON errors for connector-level failures.
osdu.openapi.contract.authorization-enforcement-enabled=true
osdu.openapi.contract.blocked-http-method-enforcement-enabled=true
osdu.openapi.contract.json-error-responses-enabled=true

spring.main.allow-bean-definition-overriding=true
# Boot 4 defaults to Jackson 3. Keep Jackson 2 so the os-core-common mapper (nulls omitted) and existing annotations stay in effect.
spring.http.converters.preferred-json-mapper=jackson2

osdu.entitlement.url=${ENTITLEMENT_URL}

ENTITLEMENTS_HOST=http://entitlements
ENTITLEMENTS_PATH=/api/entitlements/v2
ENTITLEMENT_URL=${ENTITLEMENTS_HOST}${ENTITLEMENTS_PATH}

# [Optional] [AKS] [GKE] File location of the unit catalog
osdu.unit.catalog.filename=${UNIT_CATALOG_FILENAME:/mnt/unit_catalogs/unit_catalog_v2.json}

#Health checks
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASE:/}
management.endpoints.web.exposure.include=health
management.health.probes.enabled=true
